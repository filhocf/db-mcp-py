[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-mcp-py"
version = "0.1.0"
description = "Multi-database MCP server with SSH tunnels, read-only mode, and schema filtering"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Claudio Ferreira Filho", email = "filhocf@gmail.com" },
]
keywords = ["mcp", "database", "postgresql", "ssh", "tunnel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.9.0",
    "asyncpg>=0.30.0",
    "asyncssh>=2.18.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
db-mcp-py = "db_mcp_py.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/db_mcp_py"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
